<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="compass-care-news-title compass-care-news-desc">
  <title id="compass-care-news-title">What COMPASS tracks over time</title>
  <desc id="compass-care-news-desc">A conceptual timeline pairs mood reported through phone check-ins with sleep and activity measured by a wearable. Repeated symbols represent types of measurements during follow-up.</desc>
  <style>
    :root:target {
      --canvas: #142536;
      --ink: #e8f1fa;
      --muted: #a7b8c8;
      --border: #344b60;
      --line: #8ba3b8;
      --teal: #6dcac3;
      --teal-soft: #19343a;
      --teal-border: #365c63;
    }
    text { font-family: Inter, Arial, sans-serif; fill: var(--ink, #00274c); }
    .support { fill: var(--muted, #52606d); }
  </style>

  <rect width="480" height="280" fill="var(--canvas, #f7f8f6)"/>
  <text x="28" y="51" font-size="30" font-weight="650" letter-spacing="-.55">What COMPASS tracks</text>

  <g id="participant-reports">
    <rect x="28" y="76" width="424" height="65" rx="8" fill="none" stroke="var(--border, #ccd5d5)" stroke-width="1.5"/>
    <text x="44" y="104" font-size="23" font-weight="650">Phone check-ins</text>
    <text x="44" y="128" class="support" font-size="21">Reported mood</text>
    <path d="M250 108h176" fill="none" stroke="var(--line, #728895)" stroke-width="1.5"/>
    <g fill="var(--canvas, #f7f8f6)" stroke="var(--ink, #00274c)" stroke-width="2">
      <circle cx="270" cy="108" r="4.5"/>
      <circle cx="315" cy="108" r="4.5"/>
      <circle cx="360" cy="108" r="4.5"/>
      <circle cx="405" cy="108" r="4.5"/>
    </g>
  </g>

  <g id="wearable-measures">
    <rect x="28" y="153" width="424" height="91" rx="8" fill="var(--teal-soft, #eaf2f2)" stroke="var(--teal-border, #bdd4d5)" stroke-width="1.5"/>
    <text x="44" y="182" font-size="23" font-weight="650">Wearable measures</text>
    <text x="44" y="208" class="support" font-size="21">Sleep</text>
    <text x="44" y="232" class="support" font-size="21">Activity</text>
    <g fill="none" stroke="var(--teal, #006f78)" stroke-width="2" stroke-linecap="round">
      <path d="M260 202h20m25 0h20m25 0h20m25 0h20"/>
      <path d="M264 230v-7m6 7v-7m6 7v-7m33 7v-7m6 7v-7m6 7v-7m33 7v-7m6 7v-7m6 7v-7m33 7v-7m6 7v-7m6 7v-7"/>
    </g>
  </g>

  <text x="44" y="267" class="support" font-size="20" font-weight="600">Follow-up</text>
  <path d="M250 260h176m-6-5 6 5-6 5" fill="none" stroke="var(--line, #728895)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
