<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="news-long-covid-title news-long-covid-desc">
  <title id="news-long-covid-title">Bringing together studies of long COVID</title>
  <desc id="news-long-covid-desc">Two study documents flank a globe, connected by short lines. This conceptual illustration represents combining evidence on long COVID from studies across regions. It does not show study locations, counts, or prevalence estimates.</desc>
