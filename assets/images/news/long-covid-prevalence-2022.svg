      --figure-blue: #85b8e6;
      --figure-supporting: #a7b8c8;
      --figure-border: #344b60;
      --figure-soft: #192d40;
    }
  </style>
  <rect width="480" height="280" fill="var(--figure-canvas, #f7f8f6)"/>
  <text x="240" y="55" fill="var(--figure-ink, #00274c)" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle">Long COVID</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
