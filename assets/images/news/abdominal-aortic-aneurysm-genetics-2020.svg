      --canvas: #142536; --ink: #e8f1fa; --line: #8ba3b8; --border: #344b60;
      --teal: #6dcac3; --teal-soft: #163d41; --blue: #85b8e6; --blue-soft: #1b3248;
      --purple: #bca7e8; --rust: #e7a38a; --rust-soft: #422f2c;
    }
    text { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 600; fill: var(--ink, #00274c); text-anchor: middle; }
    .line { fill: none; stroke: var(--line, #728895); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
