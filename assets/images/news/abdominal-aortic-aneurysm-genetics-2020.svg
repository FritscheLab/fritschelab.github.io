<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="news-aaa-title news-aaa-desc">
  <title id="news-aaa-title">Genetic associations with abdominal aortic aneurysm</title>
  <desc id="news-aaa-desc">A simplified abdominal aorta with a localized widening is connected to a DNA helix by a neutral line. The study identified genetic associations and evaluated a polygenic risk score in a population consisting primarily of veterans of European ancestry. Conceptual illustration, not anatomy to scale or a measured risk estimate.</desc>
