  <title id="mgi-talk-news-title">Genetics linked to health records</title>
  <desc id="mgi-talk-news-desc">A DNA helix connects without an arrow to a health record, with a small play symbol indicating a symposium video. The talk explores how research phenotypes from electronic health records are connected with genetic data. Conceptual illustration, not participant data or measured results.</desc>
