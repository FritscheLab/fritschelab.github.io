<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="psyprsweb-news-title psyprsweb-news-desc">
  <title id="psyprsweb-news-title">Evaluating mental health polygenic scores across biobanks</title>
  <desc id="psyprsweb-news-desc">One set of polygenic scores is linked by equal branches to records for the Michigan Genomics Initiative and the NIH All of Us Research Program. The marks illustrate scores and records without showing data or performance.</desc>
  <style>
    :root:target {
      --canvas: #142536;
      --ink: #e8f1fa;
      --teal: #6dcac3;
      --teal-soft: #193a40;
      --blue: #85b8e6;
      --blue-soft: #1b3248;
      --line: #8ba3b8;
    }
    text { font-family: Inter, Arial, sans-serif; font-weight: 600; fill: var(--ink, #00274c); }
  </style>
  <defs>
    <g id="record-tray">
      <rect x="13" width="148" height="58" rx="4" fill="var(--canvas, #f7f8f6)" stroke="var(--line, #728895)"/>
      <path d="M30 14h114m-114 13h114" stroke="var(--line, #728895)"/>
      <path d="M0 27L19 41H68q5 0 9 3.5t10 3.5q6 0 10-3.5t9-3.5h49l19-14v52a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4z" fill="var(--blue-soft, #eaf2f8)" stroke="var(--blue, #346aa0)"/>
    </g>
  </defs>
  <rect width="480" height="280" fill="var(--canvas, #f7f8f6)"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 133h17m27-48h-11q-16 0-16 16v64q0 16 16 16h11" stroke="var(--line, #728895)"/>
    <g id="score-sheets">
      <rect x="55" y="99" width="165" height="100" rx="5" fill="var(--teal-soft, #eaf2f2)" stroke="var(--teal, #006f78)"/>
      <rect x="41" y="86" width="165" height="100" rx="5" fill="var(--canvas, #f7f8f6)" stroke="var(--teal, #006f78)"/>
      <path d="M58 140h92m-7-4 7 4-7 4" stroke="var(--line, #728895)"/>
      <g stroke="var(--teal, #006f78)">
        <path d="M65 140v-12m16 12v-24m16 24v14m16-14v-20m16 20v-8"/>
        <g fill="var(--canvas, #f7f8f6)">
          <circle cx="65" cy="126" r="3.5"/>
          <circle cx="81" cy="115" r="3.5"/>
          <circle cx="97" cy="156" r="3.5"/>
          <circle cx="113" cy="120" r="3.5"/>
          <circle cx="129" cy="130" r="3.5"/>
        </g>
        <rect x="161" y="125" width="29" height="31" rx="4" fill="var(--teal-soft, #eaf2f2)"/>
      </g>
      <path d="M182 133h-13l7 8-7 8h13" stroke="var(--ink, #00274c)"/>
    </g>
    <use href="#record-tray" x="264" y="38"/>
    <use href="#record-tray" x="264" y="134"/>
  </g>
  <g text-anchor="middle" font-size="28">
    <text x="130" y="244">Polygenic scores</text>
    <text x="351" y="113">MGI</text>
    <text x="351" y="209">All of Us</text>
  </g>
</svg>
