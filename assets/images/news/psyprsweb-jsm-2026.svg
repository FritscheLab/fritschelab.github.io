<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="psyprsweb-news-title psyprsweb-news-desc">
  <title id="psyprsweb-news-title">Comparing polygenic scores across biobanks</title>
  <desc id="psyprsweb-news-desc">Stacked score sheets are connected without an arrow to two equally sized biobank symbols. The conceptual illustration represents evaluating mental-health polygenic scores across cohorts. It does not show score values, differences in predictive performance, or a clinical tool.</desc>
