<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="news-amd-followup-title news-amd-followup-desc">
  <title id="news-amd-followup-title">Retinal follow-up and genetics in an AMD progression study</title>
  <desc id="news-amd-followup-desc">Two identical conceptual retinal views are connected in follow-up order. Genetics is linked to both visits. The funded collaboration combines retinal imaging, clinical measures, genetics, and machine learning to study AMD progression. Identical retinal drawings do not depict disease change or establish prediction performance.</desc>
  <style>
