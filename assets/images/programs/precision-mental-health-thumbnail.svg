<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-labelledby="mental-health-preview-title mental-health-preview-desc">
  <title id="mental-health-preview-title">Studying mental health treatment response over time</title>
  <desc id="mental-health-preview-desc">Genetic data, clinical history, patient reports, and phone and wearable measures inform the study of treatment response over time. The three curves are illustrative.</desc>
  <style>
    :root:target {
      --figure-border: #344b60;
      --figure-canvas: #142536;
      --figure-ink: #e8f1fa;
      --figure-line: #8ba3b8;
      --figure-soft: #192d40;
      --figure-teal: #6dcac3;
      --figure-teal-border: #365c63;
      --figure-teal-line: #78b4b6;
      --figure-teal-soft: #163d41;
    }
  </style>

  <rect width="400" height="200" fill="var(--figure-canvas, #f7f8f6)"/>
  <g id="information-sources" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="32" width="135" height="136" rx="8" stroke="var(--figure-border, #ccd5d5)" stroke-width="1.5"/>
    <g id="genetic-information" transform="translate(45 49) scale(.55 .34)">
      <path d="M1.652 4H38.348M12.457 12H27.543M12.457 20H27.543M1.652 28H38.348M1.652 36H38.348M12.457 44H27.543M12.457 52H27.543M1.652 60H38.348M1.652 68H38.348M12.457 76H27.543M12.457 84H27.543M1.652 92H38.348" stroke="var(--figure-teal-line, #618e96)" stroke-width="3.75"/>
      <path d="M0 0C0 5.333 9.528 10.667 20 16C30.472 21.333 40 26.667 40 32C40 37.333 30.472 42.667 20 48C9.528 53.333 0 58.667 0 64C0 69.333 9.528 74.667 20 80C30.472 85.333 40 90.667 40 96" stroke="var(--figure-teal, #006f78)" stroke-width="5"/>
      <path d="M40 0C40 5.333 30.472 10.667 20 16C9.528 21.333 0 26.667 0 32C0 37.333 9.528 42.667 20 48C30.472 53.333 40 58.667 40 64C40 69.333 30.472 74.667 20 80C9.528 85.333 0 90.667 0 96" stroke="var(--figure-ink, #00274c)" stroke-width="5"/>
    </g>
    <g id="clinical-history" transform="translate(55 -34)" stroke-width="2.1">
      <path d="M43 86H61L67 92V114H43ZM61 86V92H67" fill="var(--figure-soft, #eef1ef)" stroke="var(--figure-line, #728895)"/>
      <g stroke="var(--figure-ink, #00274c)">
        <circle cx="52" cy="95" r="2.4"/>
        <path d="M48 102c0-4.5 8-4.5 8 0M48 108h10"/>
      </g>
      <g transform="translate(72 106) rotate(35)" stroke="var(--figure-teal, #006f78)">
        <rect x="-4.5" y="-9" width="9" height="18" rx="4.5" fill="var(--figure-canvas, #f7f8f6)"/>
        <path d="M-4.5 0H4.5"/>
      </g>
    </g>
    <g id="patient-reports" transform="translate(-5 -17)" stroke-width="2.1">
      <path d="M41 129H80V151H54L46 158V151H41Z" fill="var(--figure-soft, #eef1ef)" stroke="var(--figure-line, #728895)"/>
      <path d="M47 136H74" stroke="var(--figure-ink, #00274c)"/>
      <g stroke="var(--figure-teal, #006f78)">
        <circle cx="49" cy="144" r="1.7"/>
        <circle cx="60.5" cy="144" r="1.7" fill="var(--figure-teal, #006f78)"/>
        <circle cx="72" cy="144" r="1.7"/>
      </g>
    </g>
    <g id="device-information" transform="translate(95 109) scale(.55)" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="var(--figure-ink, #00274c)">
        <rect x="5" y="5" width="35" height="62" rx="5" fill="var(--figure-soft, #eef1ef)"/>
        <path d="M17 13h11M56 23V8q0-3 3-3h7q3 0 3 3v15M56 49v15q0 3 3 3h7q3 0 3-3V49"/>
      </g>
      <g stroke="var(--figure-teal, #006f78)">
        <rect x="50" y="23" width="25" height="26" rx="5" fill="var(--figure-teal-soft, #eaf2f2)"/>
        <path d="M57 36h11"/>
      </g>
    </g>
    <path id="input-connection" d="M151 100H173" stroke="var(--figure-line, #728895)" stroke-width="1.75"/>
  </g>

  <g id="response-patterns">
    <rect x="173" y="32" width="211" height="136" rx="8" fill="var(--figure-teal-soft, #eaf2f2)" stroke="var(--figure-teal-border, #bdd4d5)" stroke-width="1.5"/>
    <text x="189" y="62" fill="var(--figure-ink, #00274c)" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="-.4">Response over time</text>
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M189 92C214 92 232 102 250 100S280 79 305 82 340 91 368 85" stroke="var(--figure-teal, #006f78)"/>
      <path d="M189 115C213 114 234 118 254 118S285 107 307 109 343 117 368 121" stroke="var(--figure-ink, #00274c)"/>
      <path d="M189 140C213 140 235 130 252 132S284 150 306 147 347 138 368 139" stroke="var(--figure-line, #647d89)"/>
    </g>
    <g fill="var(--figure-teal-soft, #eaf2f2)" stroke-width="2">
      <g stroke="var(--figure-teal, #006f78)"><circle cx="189" cy="92" r="2.8"/><circle cx="250" cy="100" r="2.8"/><circle cx="368" cy="85" r="2.8"/></g>
      <g stroke="var(--figure-ink, #00274c)"><circle cx="189" cy="115" r="2.8"/><circle cx="254" cy="118" r="2.8"/><circle cx="368" cy="121" r="2.8"/></g>
      <g stroke="var(--figure-line, #647d89)"><circle cx="189" cy="140" r="2.8"/><circle cx="252" cy="132" r="2.8"/><circle cx="368" cy="139" r="2.8"/></g>
    </g>
  </g>
</svg>
