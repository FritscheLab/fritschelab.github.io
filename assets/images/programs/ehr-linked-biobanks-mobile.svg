<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="ehr-biobanks-mobile-title ehr-biobanks-mobile-desc">
  <title id="ehr-biobanks-mobile-title">Genomes and years of care in MGI, UKB, and All of Us</title>
  <desc id="ehr-biobanks-mobile-desc">A DNA helix and a timeline of clinical records represent linked genomic data and health records in MGI, UKB, and All of Us. Diagnoses, treatments, and outcomes support phenotype definition across biobanks. The neutral connection represents linked data, not causation. Researchers account for when and how care is recorded. This is a conceptual schematic, not participant data or study results.</desc>
  <defs>
    
    <g id="ehr-genome" fill="none" stroke-linecap="round">
      <path d="M1.652 4H38.348M12.457 12H27.543M12.457 20H27.543M1.652 28H38.348M1.652 36H38.348M12.457 44H27.543M12.457 52H27.543M1.652 60H38.348M1.652 68H38.348M12.457 76H27.543M12.457 84H27.543M1.652 92H38.348" stroke="#92aec4" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <path d="M0 0C0 5.333 9.528 10.667 20 16C30.472 21.333 40 26.667 40 32C40 37.333 30.472 42.667 20 48C9.528 53.333 0 58.667 0 64C0 69.333 9.528 74.667 20 80C30.472 85.333 40 90.667 40 96" stroke="#346aa0" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <path d="M40 0C40 5.333 30.472 10.667 20 16C9.528 21.333 0 26.667 0 32C0 37.333 9.528 42.667 20 48C30.472 53.333 40 58.667 40 64C40 69.333 30.472 74.667 20 80C9.528 85.333 0 90.667 0 96" stroke="#00274c" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    </g>
    
    <g id="ehr-care-history" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-104 30H104m-7-5 7 5-7 5" stroke="#728895" stroke-width="1.5"/>
      <path d="M-76 9V30M-4 7V30M73 9V30" stroke="#92aec4" stroke-width="1.5"/>
      <path d="M-93-36h23l12 12V8h-35ZM-70-36v12h12M56-36h23l12 12V8H56ZM79-36v12h12" stroke="#00274c" stroke-width="2"/>
      <path d="M-84-15h17M-84-6h17M65-15h17M65-6h17" stroke="#346aa0" stroke-width="2"/>
      <g transform="translate(-4 -13) rotate(-40)">
        <rect x="-22" y="-10" width="44" height="20" rx="10" stroke="#346aa0" stroke-width="2.5"/>
        <path d="M0-10V10" stroke="#346aa0" stroke-width="2"/>
      </g>
      <g fill="#eaf2f8" stroke="#346aa0" stroke-width="2">
        <circle cx="-76" cy="30" r="4"/><circle cx="-4" cy="30" r="4"/><circle cx="73" cy="30" r="4"/>
      </g>
    </g>
  </defs>
  <rect width="400" height="600" fill="#f7f8f6"/>
  <g font-family="Inter, Arial, sans-serif" fill="#00274c">
    <text x="24" y="44" font-size="28" font-weight="600" letter-spacing="-.5">Genomes and<tspan x="24" dy="32">years of care</tspan></text>
    <text x="24" y="108" font-size="19" fill="#52606d">MGI, UKB, and All of Us</text>
    <rect x="24" y="136" width="352" height="142" rx="8" fill="none" stroke="#ccd5d5"/>
    <text x="40" y="176" font-size="23" font-weight="600" letter-spacing="-.4">Genomic data</text>
    <text x="40" y="210" font-size="19" fill="#52606d">Variants across<tspan x="40" dy="27">the genome</tspan></text>
    <use href="#ehr-genome" transform="translate(272 161) scale(.95)"/>
    <rect x="24" y="306" width="352" height="142" rx="8" fill="#eaf2f8" stroke="#bdd0e0"/>
    <text x="40" y="341" font-size="23" font-weight="600" letter-spacing="-.4">Health records</text>
    <text x="40" y="373" font-size="19" fill="#52606d">Diagnoses,<tspan x="40" dy="26">treatments,</tspan><tspan x="40" dy="26">and outcomes</tspan></text>
    <use href="#ehr-care-history" transform="translate(291 388) scale(.66)"/>
    
    <path d="M291 278V306" fill="none" stroke="#728895" stroke-width="1.5"/>
    <circle cx="291" cy="292" r="4" fill="#f7f8f6" stroke="#346aa0" stroke-width="2"/>
    <text x="24" y="491" font-size="24" font-weight="600" letter-spacing="-.4">Define phenotypes<tspan x="24" dy="29">across biobanks</tspan></text>
    <text x="24" y="554" font-size="19" fill="#52606d">Account for when and how<tspan x="24" dy="26">care is recorded.</tspan></text>
  </g>
</svg>
